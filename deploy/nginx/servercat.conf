# ServerCat — Nginx reverse proxy configuration
# Place in: C:\nginx\conf\conf.d\servercat.conf
# Requires: Nginx for Windows 1.25+

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

server {
    listen 80;
    server_name servercat.corp.local;

    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name servercat.corp.local;

    # TLS configuration — use internal CA cert or Let's Encrypt
    ssl_certificate      C:/certs/servercat.crt;
    ssl_certificate_key  C:/certs/servercat.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout  1d;
    ssl_session_cache    shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Remove server version header
    server_tokens off;

    # Request size limit (prevent oversized payloads)
    client_max_body_size 10m;

    # ── Static SPA files ──────────────────────────────────────────
    root C:/ServerCat/wwwroot;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── API proxy ─────────────────────────────────────────────────
    location /api {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering    on;
    }

    # ── Health check (no auth required, no rate limit) ────────────
    location /health {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        access_log off;
    }

    # ── Hangfire dashboard — restrict to internal networks ────────
    location /hangfire {
        # Only allow from internal networks
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Block common attack paths ──────────────────────────────────
    location ~ /\. { deny all; }
    location ~ ^/(wp-admin|phpmyadmin|xmlrpc) { deny all; return 404; }

    # Logging
    access_log C:/nginx/logs/servercat_access.log combined;
    error_log  C:/nginx/logs/servercat_error.log  warn;
}
